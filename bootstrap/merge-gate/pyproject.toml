[project]
name = "merge-gate"
version = "0.1.0"
description = "DDA merge gate: deterministic, read-only checks before every apply, promotion and image build (design 6.5)."
readme = "README.md"
authors = [
    { name = "MikeY", email = "mikegyoung@google.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
merge-gate = "merge_gate:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 180
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
